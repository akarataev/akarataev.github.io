<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Tone Profiler</title>
  <link rel="stylesheet" href="../assets/css/document.css">
</head>
<body>
  <main>
    <p class="eyebrow">Tone Profiler</p>
    <h1>Contact Us</h1>
    <p class="lede">Send a question, bug report, or general feedback.</p>

    <form class="form" action="https://formspree.io/f/xdaqrqwb" method="POST">
      <input type="hidden" name="_subject" value="Tone Profiler contact message">

      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
