<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a Song - Tone Profiler</title>
  <link rel="stylesheet" href="../assets/css/document.css">
</head>
<body>
  <main>
    <p class="eyebrow">Tone Profiler</p>
    <h1>Request a Song</h1>
    <p class="lede">Tell us what song you would like to see in the app.</p>

    <form class="form" action="https://formspree.io/f/mzdnlnkp" method="POST">
      <input type="hidden" name="_subject" value="Tone Profiler song request">

      <div class="field">
        <label for="song">Song title</label>
        <input id="song" name="song" type="text" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="artist">Artist</label>
        <input id="artist" name="artist" type="text" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="message">Notes</label>
        <textarea id="message" name="message" placeholder="Version, live recording, tuning, or anything else that helps."></textarea>
      </div>

      <button type="submit">Send Request</button>
    </form>
  </main>
</body>
</html>
